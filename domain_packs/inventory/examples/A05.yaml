# few-shot 예시 (inventory · A05 relationship_review). 사람이 작성하는 입력 파일이다.
# - 입력은 개발용 세트(비공개, 저장소에 올리지 않음)에서만 가져오고 source_id에 원문 ID를 적는다. 평가용 세트 문서는 넣지 않는다.
# - output은 해당 노드의 LLM 출력 모델과 같은 모양이어야 한다. load_examples가 그 모델로 검증한다 (docs/04 "노드 작성 규칙").
agent: A05
role: relationship_review
status: draft
examples:
# SFR-206 지적 없음 예시: 요구사항은 거래처와 병합 이력, 표준어와 비슷한 말·오탈자의 개수·필수 여부를 정하지 않았다.
# 설계한 1:N 관계가 요구사항과 어긋나지 않으므로 지적하지 않는다 (instructions 「요구사항이 관계를 정하지 않으면 모순이 아니다」).
# 요구사항은 실제 A01 실행 결과 SFR-206(REQ-32∼37)에서 골라 text·type·nfr_category 그대로 옮기고 예시 안에서 번호만 다시 붙였다.
# 검토 대상 설계는 A03 SFR-206 예시의 설계(ID는 예시용 ENT·ATTR·REL 번호)를 쓴다.
- source_id: SFR-206
  input:
    requirements:
    - id: REQ-01
      text: 사업자등록번호가 같은 거래처를 1차로 매칭하고, 번호가 없거나 불명확한 거래처는 2차로 AI 텍스트 유사도 분석을 통해 영문 표기 차이, 오타, 기업명 약칭을 찾아 같은 업체로 묶어야 한다.
      type: FR
    - id: REQ-02
      text: 병합 규칙을 적용하여 통합 과정의 데이터 충돌을 미리 해소해야 한다.
      type: FR
    - id: REQ-03
      text: 데이터 병합 이력을 추적·관리할 수 있어야 한다.
      type: NFR
    - id: REQ-04
      text: 품목명·포장 단위의 비슷한 말과 오탈자를 LLM 판단으로 표준 용어 사전의 표준어로 일괄 변환해야 한다.
      type: FR
    - id: REQ-05
      text: 확신이 높은 건은 자동 변환하고, 애매한 건은 후보 목록을 제시하며 담당자 검수와 승인을 지원해야 한다.
      type: FR
    entities:
    - {id: ENT-01, name: 거래처}
    - {id: ENT-02, name: 거래처변경이력}
    - {id: ENT-03, name: 표준용어}
    - {id: ENT-04, name: 용어동의어}
    - {id: ENT-05, name: 품목}
    relationships:
    - {id: REL-01, parent: ENT-01, child: ENT-02, cardinality: '1:N', optional: false, identifying: false, req_ids: [REQ-03]}
    - {id: REL-02, parent: ENT-03, child: ENT-04, cardinality: '1:N', optional: false, identifying: false, req_ids: [REQ-04]}
  output:
    findings: []
