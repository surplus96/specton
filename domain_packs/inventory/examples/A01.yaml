# few-shot 예시 (inventory · A01 requirement_analysis). 사람이 작성하는 입력 파일이다.
# - 입력은 개발용 세트(예시자료/openmaint)에서만 가져오고 source_id에 원문 ID를 적는다. 평가용 세트 문서는 넣지 않는다.
# - output은 데이터 계약(B1 동결 후)과 같은 모양이어야 한다. 동결 전까지는 형식 견본이다.
agent: A01
role: requirement_analysis
status: draft
examples:
- source_id: INV-009
  input: 수량을 차감하는 수불 확정 후 현재고가 0 미만이 되어서는 안 된다. 같은 창고·품목에 여러 확정 요청이 동시에 들어와도 이 조건을 유지하며 부족하면 문서 전체를 확정하지 않는다.
  output:
    type: NFR
    nfr_category: integrity
    split: false
    questions: []
