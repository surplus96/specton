# few-shot 예시 (inventory · A01 requirement_analysis). 사람이 작성하는 입력 파일이다.
# - 입력은 개발용 세트(비공개, 저장소에 올리지 않음)에서만 가져오고 source_id에 원문 ID를 적는다. 평가용 세트 문서는 넣지 않는다.
# - output은 해당 노드의 LLM 출력 모델과 같은 모양이어야 한다. load_examples가 그 모델로 검증한다 (docs/04 "노드 작성 규칙").
# - input은 A01 노드의 input_data 모양(source_blocks)이다. 데이터 정합성 요구는 FR로 둔다 (docs/05 "비기능 분류").
# - INV-001 예시의 끝 문장 「화면은 빠르게 열려야 한다.」와 extra 「요구사항명」은 분할·품질 경고를 보이려고 더한 가상 문장이다.
# - 분할 기준: 서로 다른 동작을 하는 문장이면 나누고, 같은 대상의 값 규칙은 나누지 않는다.
#   검증 대상이 다르면 한 블록 안에서도 나눈다: INV-005는 「문서 전체의 내역 개수」(1건 이상)와 「내역 한 건의 구성·값 규칙」(품목·수량·양수·소수 셋째 자리)로 두 요구사항으로 나눈다(R1 #133 코멘트 2026-11-06T00:31Z). 수량 하한·자릿수는 같은 수량 규칙이라 한 건으로 묶는다.
# - 새 예시의 입력 블록은 A02·A05 예시의 요구사항 문장을 원문 블록처럼 쓴 것이다(개발용 세트 원본과 같은지 미확인).
# - INV-005 두 요구사항은 같은 원문 블록(xlsx:요구사항:6)을 참조하고, not_a_requirement 경고는 블록 끝 문장이 딸린 두 번째 요구사항에 붙인다.
# - INV-005 예시의 끝 문장 「이 항목은 재고관리팀 담당자가 이번 달 안에 정리해 주세요.」는 not_a_requirement를 보이려고 더한 가상 문장이다(INV-001 예시의 가상 문장과 같은 방식).
agent: A01
role: requirement_analysis
status: draft
examples:
# 블록이 둘일 때 블록마다 요구사항 하나에 연결하고, 한 블록의 두 문장은 같은 요구라 나누지 않는다
- source_id: INV-002,INV-012
  input:
    source_blocks:
    - block_id: xlsx:요구사항:3
      text: 창고 담당자는 부품·소모품의 고유 코드, 이름, 관리 단위, 사용 여부를 등록·조회·수정할 수 있어야 한다. 관리 단위는 품목별 하나이며 이미 거래한 품목의 단위는 변경하지 않는다.
      acceptance_level: null
      extra: {}
    - block_id: xlsx:요구사항:13
      text: 거래 이력이 있는 품목·창고는 삭제하지 않고 사용 중지할 수 있어야 한다. 사용 중지된 항목은 신규 거래에 선택할 수 없으며 과거 이력과 이미 확정한 거래의 취소 조회에는 남아 있어야 한다.
      acceptance_level: null
      extra: {}
  output:
    requirements:
    - source_block_ids: [xlsx:요구사항:3]
      text: 창고 담당자는 부품·소모품의 고유 코드, 이름, 관리 단위, 사용 여부를 등록·조회·수정할 수 있어야 하며, 관리 단위는 품목별 하나이고 이미 거래한 품목의 단위는 변경하지 않는다.
      type: FR
      nfr_category: null
      parent_hint: null
      quality_issues: []
    - source_block_ids: [xlsx:요구사항:13]
      text: 거래 이력이 있는 품목·창고는 삭제하지 않고 사용 중지할 수 있어야 하며, 사용 중지된 항목은 신규 거래에 선택할 수 없고 과거 이력과 이미 확정한 거래의 취소 조회에는 남아 있어야 한다.
      type: FR
      nfr_category: null
      parent_hint: null
      quality_issues: []
- source_id: INV-009
  input:
    source_blocks:
    - block_id: xlsx:요구사항:9
      text: 수량을 차감하는 수불 확정 후 현재고가 0 미만이 되어서는 안 된다. 같은 창고·품목에 여러 확정 요청이 동시에 들어와도 이 조건을 유지하며 부족하면 문서 전체를 확정하지 않는다.
      acceptance_level: null
      extra: {}
  output:
    requirements:
    - source_block_ids: [xlsx:요구사항:9]
      text: 수불 확정 후 같은 창고·품목의 현재고는 0 미만이 될 수 없고, 동시에 확정 요청이 들어와도 이 조건을 지키며 재고가 부족하면 문서 전체를 확정하지 않는다.
      type: FR
      nfr_category: null
      parent_hint: null
      quality_issues: []
# 가상 보강: 요구사항이 아닌 작업 지시 단락이 섞인 블록. 입력의 마지막 문장은 개발용 세트에 없는 **가상** 문장이고, 앞 두 문장이 INV-005다
- source_id: INV-005
  input:
    source_blocks:
    - block_id: xlsx:요구사항:6
      text: 하나의 수불 문서에는 하나 이상의 품목 내역을 등록한다. 각 내역은 한 품목과 수량을 가지며 수량은 0보다 크고 소수 셋째 자리까지 허용한다. 이 항목은 재고관리팀 담당자가 이번 달 안에 정리해 주세요.
      acceptance_level: null
      extra: {}
  output:
    requirements:
    - source_block_ids: [xlsx:요구사항:6]
      text: 수불 문서에는 품목 내역이 하나 이상 있어야 한다.
      type: FR
      nfr_category: null
      parent_hint: null
      quality_issues: []
    - source_block_ids: [xlsx:요구사항:6]
      text: 각 내역은 품목과 수량을 가지며, 수량은 양수이고 소수 셋째 자리까지 허용한다.
      type: FR
      nfr_category: null
      parent_hint: null
      quality_issues:
      - kind: not_a_requirement
        message: 마지막 문장은 담당자와 기한을 정한 작업 지시라 요구사항에 옮기지 않았다.
        question: null
- source_id: INV-001
  input:
    source_blocks:
    - block_id: xlsx:요구사항:2
      text: 창고 담당자는 창고별 고유 코드와 이름, 사업장 명칭, 사용 여부를 등록·조회·수정할 수 있어야 한다. 코드가 같은 창고는 중복 등록할 수 없다. 화면은 빠르게 열려야 한다.
      acceptance_level: 필수
      extra:
        요구사항명: 창고 관리
  output:
    requirements:
    - source_block_ids: [xlsx:요구사항:2]
      text: 창고 담당자는 창고별 고유 코드와 이름, 사업장 명칭, 사용 여부를 등록·조회·수정할 수 있어야 하며, 코드가 같은 창고는 중복 등록할 수 없다.
      type: FR
      nfr_category: null
      parent_hint: 창고 관리
      quality_issues: []
    - source_block_ids: [xlsx:요구사항:2]
      text: 창고 관리 화면은 빠르게 열려야 한다.
      type: NFR
      nfr_category: performance
      parent_hint: 창고 관리
      quality_issues:
      - kind: missing_value
        message: 「빠르게」의 기준 시간이 없다.
        question: 창고 관리 화면이 몇 초 안에 열려야 합니까?
