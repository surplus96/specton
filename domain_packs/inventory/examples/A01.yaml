# few-shot 예시 (inventory · A01 requirement_analysis). 사람이 작성하는 입력 파일이다.
# - 입력은 개발용 세트(비공개, 저장소에 올리지 않음)에서만 가져오고 source_id에 원문 ID를 적는다. 평가용 세트 문서는 넣지 않는다.
# - output은 해당 노드의 LLM 출력 모델과 같은 모양이어야 한다. load_examples가 그 모델로 검증한다 (docs/04 "노드 작성 규칙").
# - input은 A01 노드의 input_data 모양(source_blocks)이다. 데이터 정합성 요구는 FR로 둔다 (docs/05 "비기능 분류").
# - INV-001 예시의 끝 문장 「화면은 빠르게 열려야 한다.」와 extra 「요구사항명」은 분할·품질 경고를 보이려고 더한 가상 문장이다.
agent: A01
role: requirement_analysis
status: draft
examples:
- source_id: INV-009
  input:
    source_blocks:
    - block_id: xlsx:요구사항:9
      text: 수량을 차감하는 수불 확정 후 현재고가 0 미만이 되어서는 안 된다. 같은 창고·품목에 여러 확정 요청이 동시에 들어와도 이 조건을 유지하며 부족하면 문서 전체를 확정하지 않는다.
      acceptance_level: null
      extra: {}
  output:
    requirements:
    - source_block_ids: [xlsx:요구사항:9]
      text: 수불 확정 후 같은 창고·품목의 현재고는 0 미만이 될 수 없고, 동시에 확정 요청이 들어와도 이 조건을 지키며 재고가 부족하면 문서 전체를 확정하지 않는다.
      type: FR
      nfr_category: null
      parent_hint: null
      quality_issues: []
- source_id: INV-001
  input:
    source_blocks:
    - block_id: xlsx:요구사항:2
      text: 창고 담당자는 창고별 고유 코드와 이름, 사업장 명칭, 사용 여부를 등록·조회·수정할 수 있어야 한다. 코드가 같은 창고는 중복 등록할 수 없다. 화면은 빠르게 열려야 한다.
      acceptance_level: 필수
      extra:
        요구사항명: 창고 관리
  output:
    requirements:
    - source_block_ids: [xlsx:요구사항:2]
      text: 창고 담당자는 창고별 고유 코드와 이름, 사업장 명칭, 사용 여부를 등록·조회·수정할 수 있어야 하며, 코드가 같은 창고는 중복 등록할 수 없다.
      type: FR
      nfr_category: null
      parent_hint: 창고 관리
      quality_issues: []
    - source_block_ids: [xlsx:요구사항:2]
      text: 창고 관리 화면은 빠르게 열려야 한다.
      type: NFR
      nfr_category: performance
      parent_hint: 창고 관리
      quality_issues:
      - kind: missing_value
        message: 「빠르게」의 기준 시간이 없다.
        question: 창고 관리 화면이 몇 초 안에 열려야 합니까?
