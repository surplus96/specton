# few-shot 예시 (inventory · A03 entity_attribute_crud). 사람이 작성하는 입력 파일이다.
# - 입력은 개발용 세트(비공개, 저장소에 올리지 않음)에서만 가져오고 source_id에 원문 ID를 적는다. 평가용 세트 문서는 넣지 않는다.
# - output은 해당 노드의 LLM 출력 모델과 같은 모양이어야 한다. load_examples가 그 모델로 검증한다 (docs/04 "노드 작성 규칙").
agent: A03
role: entity_attribute_crud
status: draft
examples:
- source_id: INV-001,INV-002,INV-012
  input:
    requirements:
    - id: REQ-01
      type: FR
      nfr_category: null
      text: 창고 담당자는 창고별 고유 코드와 이름, 사업장 명칭, 사용 여부를 등록·조회·수정할 수 있어야 한다. 코드가 같은 창고는 중복 등록할 수 없다.
    - id: REQ-02
      type: FR
      nfr_category: null
      text: 창고 담당자는 부품·소모품의 고유 코드, 이름, 관리 단위, 사용 여부를 등록·조회·수정할 수 있어야 한다. 관리 단위는 품목별 하나이며 이미 거래한 품목의 단위는 변경하지 않는다.
    - id: REQ-03
      type: FR
      nfr_category: null
      text: 거래 이력이 있는 품목·창고는 삭제하지 않고 사용 중지할 수 있어야 한다. 사용 중지된 항목은 신규 거래에 선택할 수 없으며 과거 이력과 이미 확정한 거래의 취소 조회에는 남아 있어야 한다.
    functions:
    - id: FUNC-01
      name: 창고·품목 관리
      description: 창고 담당자가 창고와 품목의 기준 정보를 등록·조회·수정하고, 거래 이력이 있는 항목은 삭제 대신 사용 중지한다. 코드 중복과 거래 후 단위 변경을 막는다.
      req_ids: [REQ-01, REQ-02, REQ-03]
    pack:
      terms:
      - {term: 창고코드, data_type: varchar, length: 10}
      - {term: 창고명, data_type: varchar, length: 200}
      - {term: 사업장명, data_type: varchar, length: 200}
      - {term: 사용여부, data_type: char, length: 1}
      - {term: 품목코드, data_type: varchar, length: 10}
      - {term: 품목명, data_type: varchar, length: 100}
      - {term: 단위명, data_type: varchar, length: 100}
      crud_exemption_reasons:
        immutable_ledger: [U, D]
        soft_delete: [D]
  output:
    entities:
    - name: 창고
      description: 재고를 보관하는 창고의 기준 정보
      req_ids: [REQ-01, REQ-03]
      attributes:
      - {name: 창고코드, description: 창고 고유 코드, data_type: varchar, length: 10, is_key: true, nullable: false, req_ids: [REQ-01]}
      - {name: 창고명, data_type: varchar, length: 200, req_ids: [REQ-01]}
      - {name: 사업장명, data_type: varchar, length: 200, req_ids: [REQ-01]}
      - {name: 사용여부, description: 사용 중지 시 N, data_type: char, length: 1, req_ids: [REQ-01, REQ-03]}
      crud_exemptions:
      - {operation: D, reason: soft_delete}
    - name: 품목
      description: 부품·소모품 품목의 기준 정보
      req_ids: [REQ-02, REQ-03]
      attributes:
      - {name: 품목코드, data_type: varchar, length: 10, is_key: true, nullable: false, req_ids: [REQ-02]}
      - {name: 품목명, data_type: varchar, length: 100, req_ids: [REQ-02]}
      - {name: 단위명, description: 거래한 품목의 단위는 변경 불가, data_type: varchar, length: 100, req_ids: [REQ-02]}
      - {name: 사용여부, data_type: char, length: 1, req_ids: [REQ-02, REQ-03]}
      crud_exemptions:
      - {operation: D, reason: soft_delete}
    entity_ops:
    - {function_id: FUNC-01, entity_name: 창고, operations: [C, R, U]}
    - {function_id: FUNC-01, entity_name: 품목, operations: [C, R, U]}
# A03.yaml의 examples: 목록 맨 끝(기존 첫 예시 INV-001,INV-002,INV-012 뒤)에 그대로 붙인다.
# SFR-201(보관 위치 배정·이동 지시). requirements는 실제 A01이 나눈 7건(REQ-01∼07)의
# text·type·nfr_category를 고치지 않고 옮긴 것이다.
# functions 3개(FUNC-01∼03)는 A02 실행 결과가 아니라 이 예시를 위해 사람이 작성한 것이다.
# input은 A03 input_data가 만드는 모양 그대로다(pack.terms는 실제 팩 용어에서 골랐다).
# - 팩 용어에 맞는 속성이 없어 속성은 요구사항에 근거해 직접 정한다. 배정수량은 재고수량이 아니다.
# - 보관 위치는 「미리 정한/미리 만든」 기준 정보라 이 요구사항들로는 조회(R)만 한다.
# - 상품(품목)·입고 예정과의 연결은 FK·관계라 A03에서 쓰지 않는다(입고예정번호는 받은 정보의 번호 값).
- source_id: SFR-201
  input:
    requirements:
    - id: REQ-01
      type: FR
      nfr_category: null
      text: 입고 예정 정보를 받으면 입고 뒤 옮길 보관 위치를 할당해 배정해야 한다.
    - id: REQ-02
      type: FR
      nfr_category: null
      text: 배송권역별·간선권역별 물량 변동에 맞춰 미리 정한 보관 위치에 물량을 미리 배정할 수 있어야 한다.
    - id: REQ-03
      type: FR
      nfr_category: null
      text: 한 권역의 보관 위치에 물량이 몰리면 효율적으로 나눠야 한다.
    - id: REQ-04
      type: FR
      nfr_category: null
      text: 입고된 상품을 미리 만든 보관 구역 또는 지정한 랙으로 옮기도록 이동 작업 지시를 생성해야 한다.
    - id: REQ-05
      type: FR
      nfr_category: null
      text: 상품의 배송지가 관내인지 광역인지 확인해 해당 유형의 화물을 내보내는 구역으로 구분해야 한다.
    - id: REQ-06
      type: FR
      nfr_category: null
      text: 입고 처리한 상품의 송장이나 라벨을 스캔하면 이동·보관 위치 정보를 조회할 수 있어야 한다.
    - id: REQ-07
      type: FR
      nfr_category: null
      text: 보관 위치는 창고 상황에 따라 시스템이 자동 배정하거나 작업자가 직접 배정할 수 있어야 한다.
    functions:
    - id: FUNC-01
      name: 보관 위치 배정
      description: 입고 예정 정보를 받으면 상품을 옮길 보관 위치를 시스템이 자동 배정하거나 작업자가 직접 배정한다. 권역별 물량 변동에 맞춰 미리 배정하고 한 권역에 몰린 물량은 나눈다.
      req_ids: [REQ-01, REQ-02, REQ-03, REQ-07]
    - id: FUNC-02
      name: 이동 작업 지시
      description: 입고된 상품을 보관 구역 또는 지정한 랙으로 옮기는 이동 작업 지시를 생성하고, 배송지가 관내인지 광역인지에 따라 내보내는 구역을 구분한다.
      req_ids: [REQ-04, REQ-05]
    - id: FUNC-03
      name: 보관 위치 조회
      description: 입고 처리한 상품의 송장이나 라벨을 스캔해 이동·보관 위치를 조회한다.
      req_ids: [REQ-06]
    pack:
      terms:
      - {term: 창고코드, data_type: varchar, length: 10}
      - {term: 품목코드, data_type: varchar, length: 10}
      - {term: 재고수량, data_type: numeric, precision: 10, scale: 3}
      crud_exemption_reasons:
        immutable_ledger: [U, D]
        soft_delete: [D]
  output:
    entities:
    - name: 보관위치
      description: 상품을 보관하는 창고 안의 보관 구역·랙 위치
      req_ids: [REQ-01, REQ-02, REQ-05]
      attributes:
      - {name: 보관위치코드, data_type: varchar, length: 10, is_key: true, nullable: false, req_ids: [REQ-01]}
      - {name: 권역유형코드, description: 이 위치를 미리 정해 둔 권역의 종류(배송권역 또는 간선권역), data_type: varchar, length: 2, req_ids: [REQ-02]}
      - {name: 권역코드, description: 권역유형코드가 가리키는 배송권역 또는 간선권역의 코드, data_type: varchar, length: 10, req_ids: [REQ-02, REQ-03]}
      - {name: 배송지구분코드, description: 이 구역이 내보내는 화물의 배송지 유형(관내·광역), data_type: varchar, length: 2, req_ids: [REQ-05]}
    - name: 보관위치배정
      description: 입고 예정 상품을 보관 위치에 배정한 내역
      req_ids: [REQ-01, REQ-02, REQ-03, REQ-07]
      attributes:
      - {name: 배정번호, data_type: varchar, length: 20, is_key: true, nullable: false, req_ids: [REQ-01]}
      - {name: 입고예정번호, description: 배정의 근거가 된 입고 예정 정보의 번호, data_type: varchar, length: 20, req_ids: [REQ-01]}
      - {name: 배정수량, description: 보관 위치에 배정한 물량, data_type: numeric, precision: 10, scale: 3, req_ids: [REQ-02, REQ-03]}
      - {name: 배정방식코드, description: 시스템 자동 배정 또는 작업자 직접 배정, data_type: varchar, length: 2, req_ids: [REQ-07]}
    - name: 이동지시
      description: 입고된 상품을 보관 구역·랙으로 옮기라는 이동 작업 지시
      req_ids: [REQ-04, REQ-06]
      attributes:
      - {name: 이동지시번호, data_type: varchar, length: 20, is_key: true, nullable: false, req_ids: [REQ-04]}
      - {name: 송장번호, description: 스캔해 이동·보관 위치를 조회하는 송장 번호, data_type: varchar, length: 20, req_ids: [REQ-06]}
      - {name: 라벨번호, description: 스캔해 이동·보관 위치를 조회하는 라벨 번호, data_type: varchar, length: 20, req_ids: [REQ-06]}
    entity_ops:
    - {function_id: FUNC-01, entity_name: 보관위치, operations: [R]}
    - {function_id: FUNC-01, entity_name: 보관위치배정, operations: [C, R, U]}
    - {function_id: FUNC-02, entity_name: 보관위치, operations: [R]}
    - {function_id: FUNC-02, entity_name: 보관위치배정, operations: [R]}
    - {function_id: FUNC-02, entity_name: 이동지시, operations: [C]}
    - {function_id: FUNC-03, entity_name: 이동지시, operations: [R]}
    - {function_id: FUNC-03, entity_name: 보관위치, operations: [R]}
# SFR-206(데이터 정비 및 마스터 데이터 관리). A03.yaml examples 목록 끝에 붙인다.
# 요구사항은 실제 A01 실행 결과 SFR-206의 6건(REQ-32∼37)을 text·type·nfr_category 그대로 옮기고 예시 안에서만 REQ-01∼06으로 다시 번호를 붙였다.
# functions 4개는 A02 실행 결과가 아니라 이 예시를 위해 사람이 작성한 것이다(A02_helper_entry.yaml과 같다).
# input은 A03 input_data가 만드는 모양 그대로다. pack.terms는 지금 팩에 있는 용어만 골랐다.
# - 거래처번호·거래처명·거래처사업자등록번호·이력번호·용어명·동의어명·승인여부·승인일시·승인자아이디는 팩 용어가 없어
#   요구사항에 근거해 직접 정한다(타입은 공통표준 용어의 도메인과 같게 했다).
# - REQ-06은 저장할 대상이 정해지지 않아 어느 엔티티·속성에도 붙이지 않는다(억지로 연결하지 않는다).
# - 「같은 업체로 묶음」(REQ-01) 결과는 따로 저장하지 않는다. 요구사항이 묶은 결과를 남기라고 하지 않았고,
#   묶은 결과는 거래처 통합(FUNC-02)이 바로 써서 거래처를 고치고 거래처변경이력에 남긴다. 그래서 FUNC-01은 거래처를 조회(R)만 한다.
# - 거래처변경이력의 부모 키(거래처번호)와 용어동의어의 부모 키(용어명)는 FK라 쓰지 않는다(A04·정리 코드가 만든다).
# - 요구사항이 삭제 금지·수정 금지를 정하지 않아 CRUD 면제를 쓰지 않는다.
- source_id: SFR-206
  input:
    requirements:
    - id: REQ-01
      type: FR
      nfr_category: null
      text: 사업자등록번호가 같은 거래처를 1차로 매칭하고, 번호가 없거나 불명확한 거래처는 2차로 AI 텍스트 유사도 분석을 통해 영문 표기 차이, 오타, 기업명 약칭을 찾아 같은 업체로 묶어야 한다.
    - id: REQ-02
      type: FR
      nfr_category: null
      text: 병합 규칙을 적용하여 통합 과정의 데이터 충돌을 미리 해소해야 한다.
    - id: REQ-03
      type: NFR
      nfr_category: audit
      text: 데이터 병합 이력을 추적·관리할 수 있어야 한다.
    - id: REQ-04
      type: FR
      nfr_category: null
      text: 품목명·포장 단위의 비슷한 말과 오탈자를 LLM 판단으로 표준 용어 사전의 표준어로 일괄 변환해야 한다.
    - id: REQ-05
      type: FR
      nfr_category: null
      text: 확신이 높은 건은 자동 변환하고, 애매한 건은 후보 목록을 제시하며 담당자 검수와 승인을 지원해야 한다.
    - id: REQ-06
      type: FR
      nfr_category: null
      text: 부서별 기준 차이로 인한 혼선을 막기 위해 조직 전체의 합의 절차를 지원하고 AI 학습 데이터의 범주를 명확히 정하는 체계를 마련해야 한다.
    functions:
    - id: FUNC-01
      name: 중복 거래처 식별
      description: 사업자등록번호가 같은 거래처를 1차로 매칭하고, 번호가 없거나 불명확한 거래처는 AI 텍스트 유사도 분석으로 영문 표기 차이·오타·약칭을 찾아 같은 업체로 묶는다. 묶은 결과는 거래처 통합에 넘긴다.
      req_ids: [REQ-01]
    - id: FUNC-02
      name: 거래처 통합
      description: 같은 업체로 묶인 거래처를 병합 규칙에 따라 데이터 충돌을 해소해 하나로 통합하고, 통합할 때마다 변경 전후 내용·사유·변경자·일시를 병합 이력으로 남긴다.
      req_ids: [REQ-02, REQ-03]
    - id: FUNC-03
      name: 표준 용어 관리·일괄 변환
      description: 표준 용어와 그 비슷한 말·오탈자를 등록·조회·수정하고, 품목명·포장 단위의 비슷한 말과 오탈자를 표준어로 일괄 변환한다.
      req_ids: [REQ-04]
    - id: FUNC-04
      name: 변환 검수·승인
      description: 확신이 높은 건은 자동 변환하고, 애매한 건은 후보 목록으로 보여 주어 담당자가 검수하고 승인한다. 승인한 담당자와 일시를 남긴다.
      req_ids: [REQ-05]
    pack:
      terms:
      - {term: 품목코드, data_type: varchar, length: 10}
      - {term: 품목명, data_type: varchar, length: 100}
      - {term: 단위명, data_type: varchar, length: 100}
      - {term: 변경일시, data_type: timestamp}
      - {term: 변경사유, data_type: varchar, length: 4000}
      - {term: 변경이전내용, data_type: varchar, length: 4000}
      - {term: 변경이후내용, data_type: varchar, length: 4000}
      - {term: 변경사용자아이디, data_type: varchar, length: 20}
      crud_exemption_reasons:
        immutable_ledger: [U, D]
        soft_delete: [D]
  output:
    entities:
    - name: 거래처
      description: 거래하는 업체의 기준 정보. 같은 업체로 묶인 거래처는 하나로 통합한다
      req_ids: [REQ-01, REQ-02]
      attributes:
      - {name: 거래처번호, data_type: varchar, length: 50, is_key: true, nullable: false, req_ids: [REQ-01]}
