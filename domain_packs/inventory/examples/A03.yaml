# few-shot 예시 (inventory · A03 entity_attribute_crud). 사람이 작성하는 입력 파일이다.
# - 입력은 개발용 세트(비공개, 저장소에 올리지 않음)에서만 가져오고 source_id에 원문 ID를 적는다. 평가용 세트 문서는 넣지 않는다.
# - output은 해당 노드의 LLM 출력 모델과 같은 모양이어야 한다. load_examples가 그 모델로 검증한다 (docs/04 "노드 작성 규칙").
agent: A03
role: entity_attribute_crud
status: draft
examples:
- source_id: INV-001,INV-002,INV-012
  input:
    requirements:
    - id: REQ-01
      type: FR
      nfr_category: null
      text: 창고 담당자는 창고별 고유 코드와 이름, 사업장 명칭, 사용 여부를 등록·조회·수정할 수 있어야 한다. 코드가 같은 창고는 중복 등록할 수 없다.
    - id: REQ-02
      type: FR
      nfr_category: null
      text: 창고 담당자는 부품·소모품의 고유 코드, 이름, 관리 단위, 사용 여부를 등록·조회·수정할 수 있어야 한다. 관리 단위는 품목별 하나이며 이미 거래한 품목의 단위는 변경하지 않는다.
    - id: REQ-03
      type: FR
      nfr_category: null
      text: 거래 이력이 있는 품목·창고는 삭제하지 않고 사용 중지할 수 있어야 한다. 사용 중지된 항목은 신규 거래에 선택할 수 없으며 과거 이력과 이미 확정한 거래의 취소 조회에는 남아 있어야 한다.
    functions:
    - id: FUNC-01
      name: 창고·품목 관리
      description: 창고 담당자가 창고와 품목의 기준 정보를 등록·조회·수정하고, 거래 이력이 있는 항목은 삭제 대신 사용 중지한다. 코드 중복과 거래 후 단위 변경을 막는다.
      req_ids: [REQ-01, REQ-02, REQ-03]
    pack:
      terms:
      - {term: 창고코드, data_type: varchar, length: 10}
      - {term: 창고명, data_type: varchar, length: 200}
      - {term: 사업장명, data_type: varchar, length: 200}
      - {term: 사용여부, data_type: char, length: 1}
      - {term: 품목코드, data_type: varchar, length: 10}
      - {term: 품목명, data_type: varchar, length: 100}
      - {term: 단위명, data_type: varchar, length: 100}
      crud_exemption_reasons:
        immutable_ledger: [U, D]
        soft_delete: [D]
  output:
    entities:
    - name: 창고
      description: 재고를 보관하는 창고의 기준 정보
      req_ids: [REQ-01, REQ-03]
      attributes:
      - {name: 창고코드, description: 창고 고유 코드, data_type: varchar, length: 10, is_key: true, nullable: false, req_ids: [REQ-01]}
      - {name: 창고명, data_type: varchar, length: 200, req_ids: [REQ-01]}
      - {name: 사업장명, data_type: varchar, length: 200, req_ids: [REQ-01]}
      - {name: 사용여부, description: 사용 중지 시 N, data_type: char, length: 1, req_ids: [REQ-01, REQ-03]}
      crud_exemptions:
      - {operation: D, reason: soft_delete}
    - name: 품목
      description: 부품·소모품 품목의 기준 정보
      req_ids: [REQ-02, REQ-03]
      attributes:
      - {name: 품목코드, data_type: varchar, length: 10, is_key: true, nullable: false, req_ids: [REQ-02]}
      - {name: 품목명, data_type: varchar, length: 100, req_ids: [REQ-02]}
      - {name: 단위명, description: 거래한 품목의 단위는 변경 불가, data_type: varchar, length: 100, req_ids: [REQ-02]}
      - {name: 사용여부, data_type: char, length: 1, req_ids: [REQ-02, REQ-03]}
      crud_exemptions:
      - {operation: D, reason: soft_delete}
    entity_ops:
    - {function_id: FUNC-01, entity_name: 창고, operations: [C, R, U]}
    - {function_id: FUNC-01, entity_name: 품목, operations: [C, R, U]}
