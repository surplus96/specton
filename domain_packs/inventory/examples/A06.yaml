# few-shot 예시 (inventory · A06 missing_data_review). 사람이 작성하는 입력 파일이다.
# - 입력은 개발용 세트(비공개, 저장소에 올리지 않음)에서만 가져오고 source_id에 원문 ID를 적는다. 평가용 세트 문서는 넣지 않는다.
# - output은 해당 노드의 LLM 출력 모델과 같은 모양이어야 한다. load_examples가 그 모델로 검증한다 (docs/04 "노드 작성 규칙").
# - 요구사항 문장은 개발용 세트(INV-001·INV-002·INV-009·INV-012)의 것이고, 검토 대상 기능·엔티티는 예시를 위해 만든 가상 설계다.
agent: A06
role: missing_data_review
status: draft
examples:
# 지적 없음 예시: 사업장 명칭은 사업장 엔티티가, 조회는 별도 조회 기능이 맡는다. 다른 곳에서 충족하면 누락이 아니다.
- source_id: INV-001
  input:
    requirements:
    - id: REQ-01
      type: FR
      nfr_category: null
      text: 창고 담당자는 창고별 고유 코드와 이름, 사업장 명칭, 사용 여부를 등록·조회·수정할 수 있어야 한다. 코드가 같은 창고는 중복 등록할 수 없다.
    functions:
    - {id: FUNC-01, name: 창고 등록·수정, description: 창고를 등록하고 수정한다. 같은 코드는 등록하지 못하게 한다, req_ids: [REQ-01]}
    - {id: FUNC-02, name: 창고 조회, description: 창고 목록과 상세를 조회한다, req_ids: [REQ-01]}
    entities:
    - id: ENT-01
      pack: inventory
      name: 창고
      description: 재고를 보관하는 창고
      req_ids: [REQ-01]
      crud_exemptions: []
      attributes:
      - {id: ATTR-01, name: 창고코드, data_type: varchar, length: 10, is_key: true, nullable: false, req_ids: [REQ-01]}
      - {id: ATTR-02, name: 창고명, data_type: varchar, length: 300, req_ids: [REQ-01]}
      - {id: ATTR-03, name: 사업장코드, description: 창고가 속한 사업장, data_type: varchar, length: 10, req_ids: [REQ-01]}
      - {id: ATTR-04, name: 사용여부, data_type: char, length: 1, req_ids: [REQ-01]}
    - id: ENT-02
      pack: inventory
      name: 사업장
      description: 창고가 속한 사업장
      req_ids: [REQ-01]
      crud_exemptions: []
      attributes:
      - {id: ATTR-05, name: 사업장코드, data_type: varchar, length: 10, is_key: true, nullable: false, req_ids: [REQ-01]}
      - {id: ATTR-06, name: 사업장명, data_type: varchar, length: 300, req_ids: [REQ-01]}
  output:
    findings: []
# 지적 예시: 요구사항이 나열한 항목(관리 단위)을 저장할 속성이 설계 어디에도 없다.
- source_id: INV-002
  input:
    requirements:
    - id: REQ-01
      type: FR
      nfr_category: null
      text: 창고 담당자는 부품·소모품의 고유 코드, 이름, 관리 단위, 사용 여부를 등록·조회·수정할 수 있어야 한다. 관리 단위는 품목별 하나이며 이미 거래한 품목의 단위는 변경하지 않는다.
    functions:
    - {id: FUNC-01, name: 품목 관리, description: 품목을 등록·조회·수정한다, req_ids: [REQ-01]}
    entities:
    - id: ENT-01
      pack: inventory
      name: 품목
      description: 부품·소모품의 마스터
      req_ids: [REQ-01]
      crud_exemptions: []
      attributes:
      - {id: ATTR-01, name: 품목코드, data_type: varchar, length: 10, is_key: true, nullable: false, req_ids: [REQ-01]}
      - {id: ATTR-02, name: 품목명, data_type: varchar, length: 300, req_ids: [REQ-01]}
      - {id: ATTR-03, name: 사용여부, data_type: char, length: 1, req_ids: [REQ-01]}
  output:
    findings:
    - kind: missing_attribute
      severity: major
      targets:
      - {kind: entity, id: ENT-01}
      evidence:
      - req_id: REQ-01
        quote: 고유 코드, 이름, 관리 단위, 사용 여부를 등록·조회·수정할 수 있어야 한다
      suggestion: 요구사항이 품목마다 남기라고 한 관리 단위를 저장할 속성이 품목 엔티티와 다른 엔티티 어디에도 없다. 품목 엔티티에 관리 단위 속성을 추가한다.
      target_stage: data_model
# 지적 없음 예시(기능): 사용 중지를 별도 기능이 아니라 수정 기능이 맡는다. 다른 기능이 같은 요구를 충족하면 누락이 아니다.
- source_id: INV-012
  input:
    requirements:
    - id: REQ-01
      type: FR
      nfr_category: null
      text: 거래 이력이 있는 품목·창고는 삭제하지 않고 사용 중지할 수 있어야 한다. 사용 중지된 항목은 신규 거래에 선택할 수 없으며 과거 이력과 이미 확정한 거래의 취소 조회에는 남아 있어야 한다.
    functions:
    - {id: FUNC-01, name: 기준 정보 수정, description: 품목과 창고의 기준 정보를 수정하며 거래 이력이 있으면 삭제하지 않고 사용 여부를 N으로 바꿔 사용 중지한다, req_ids: [REQ-01]}
    - {id: FUNC-02, name: 거래 선택 조회, description: 신규 거래에는 사용 중지된 품목·창고를 빼고 보여 주고 과거 이력과 취소 조회에는 남겨 보여 준다, req_ids: [REQ-01]}
    entities:
    - id: ENT-01
      pack: inventory
      name: 품목
      description: 부품·소모품의 마스터
      req_ids: [REQ-01]
      crud_exemptions: []
      attributes:
      - {id: ATTR-01, name: 품목코드, data_type: varchar, length: 10, is_key: true, nullable: false, req_ids: [REQ-01]}
      - {id: ATTR-02, name: 사용여부, data_type: char, length: 1, req_ids: [REQ-01]}
    - id: ENT-02
      pack: inventory
      name: 창고
      description: 재고를 보관하는 창고
      req_ids: [REQ-01]
      crud_exemptions: []
      attributes:
      - {id: ATTR-03, name: 창고코드, data_type: varchar, length: 10, is_key: true, nullable: false, req_ids: [REQ-01]}
      - {id: ATTR-04, name: 사용여부, data_type: char, length: 1, req_ids: [REQ-01]}
  output:
    findings: []
# 지적 예시(기능): 요구사항이 정한 동작(수불 확정)을 맡는 기능이 기능 목록에 없다.
- source_id: INV-009
  input:
    requirements:
    - id: REQ-01
      type: FR
      nfr_category: null
      text: 수량을 차감하는 수불 확정 후 현재고가 0 미만이 되어서는 안 된다. 같은 창고·품목에 여러 확정 요청이 동시에 들어와도 이 조건을 유지하며 부족하면 문서 전체를 확정하지 않는다.
    functions:
    - {id: FUNC-01, name: 수불 문서 등록, description: 입고·출고 수불 문서와 품목 내역을 등록해 저장한다, req_ids: [REQ-01]}
    - {id: FUNC-02, name: 수불 문서 조회, description: 수불 문서와 창고·품목별 현재고를 조회한다, req_ids: [REQ-01]}
    entities:
    - id: ENT-01
      pack: inventory
      name: 수불문서
      description: 입고·출고 수불 거래 문서
      req_ids: [REQ-01]
      crud_exemptions: []
      attributes:
      - {id: ATTR-01, name: 문서번호, data_type: varchar, length: 20, is_key: true, nullable: false, req_ids: [REQ-01]}
      - {id: ATTR-02, name: 문서일자, data_type: date, req_ids: [REQ-01]}
    - id: ENT-02
      pack: inventory
      name: 현재고
      description: 창고·품목별 현재고 수량
      req_ids: [REQ-01]
      crud_exemptions: []
      attributes:
      - {id: ATTR-03, name: 창고코드, data_type: varchar, length: 10, is_key: true, nullable: false, req_ids: [REQ-01]}
      - {id: ATTR-04, name: 품목코드, data_type: varchar, length: 10, is_key: true, nullable: false, req_ids: [REQ-01]}
      - {id: ATTR-05, name: 현재고수량, data_type: numeric, precision: 15, scale: 3, req_ids: [REQ-01]}
  output:
    findings:
    - kind: missing_function
      severity: major
      targets:
      - {kind: requirement, id: REQ-01}
      evidence:
      - req_id: REQ-01
        quote: 부족하면 문서 전체를 확정하지 않는다
      suggestion: 요구사항이 수불을 확정하는 동작과 재고가 부족하면 문서 전체를 확정하지 않는 처리를 정했는데, 기능 목록에는 등록과 조회만 있고 확정을 맡는 기능이 없다. 수불 확정 기능을 추가하고 부족하면 문서 전체를 확정하지 않는 조건을 설명에 넣는다.
      target_stage: functions
