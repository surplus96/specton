# ERD 업무 영역 (#13). PDF ERD를 전체 관계 개요 + 영역별 상세도로 나눌 때 쓴다 (ADR-0004).
# - 엔티티(테이블) 한글 이름에 낱말이 들어 있으면 그 영역에 넣는다. 띄어쓰기는 무시한다.
# - 여러 영역 낱말이 함께 들어 있으면 더 긴 낱말의 영역, 길이가 같으면 먼저 적힌 영역이다.
#   예: 「거래처」(3글자)는 수불의 「거래」(2글자)보다 길어 기준정보로 간다.
# - 영역 순서: 수불 → 재고 이력 → 기준정보. 기준정보 낱말(창고·품목·자재)이 거래 이름 안에 자주
#   들어가므로 길이가 같으면 거래 쪽이 이기게 기준정보를 맨 뒤에 둔다 (R4 검토, #199).
#   예: 자재투입 → 수불, 창고재고 → 재고 이력, 품목입고내역 → 수불. 이 순서가 PDF 상세도 순서도 된다.
# - 어디에도 안 걸리면 「기타」 상세도에 넣는다(예: 표준용어). 같은 낱말을 두 영역에 적으면 팩 오류다.
# - 「수정」「기록」처럼 흔한 말은 넣지 않는다.
# - 영역 초안 R4(#13 댓글, 2026-11-06), 낱말 보완 R4 검토(#199). 거래처·거래는 R5 제안.
areas:
  - name: 수불
    words: [수불, 입고, 출고, 투입, 거래, 이동]
  - name: 재고 이력
    words: [재고, 이력, 실사, 조정, 로트]
  - name: 기준정보
    words: [창고, 품목, 자재, 거래처, 보관위치]
