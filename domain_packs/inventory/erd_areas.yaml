# ERD 업무 영역 (#13). PDF ERD를 전체 관계 개요 + 영역별 상세도로 나눌 때 쓴다 (ADR-0004).
# - 엔티티(테이블) 한글 이름에 낱말이 들어 있으면 그 영역에 넣는다. 띄어쓰기는 무시한다.
# - 여러 영역 낱말이 함께 들어 있으면 더 긴 낱말의 영역, 길이가 같으면 먼저 적힌 영역이다.
#   예: 「거래처」(3글자)는 수불의 「거래」(2글자)보다 길어 기준정보로 간다.
# - 어디에도 안 걸리면 「기타」 상세도에 넣는다. 같은 낱말을 두 영역에 적으면 팩 오류다.
# - 영역 초안은 R4 제안(#13 댓글, 2026-11-06)이다. 「R5 제안」 표시 낱말은 리뷰에서 확인한다.
areas:
  - name: 기준정보
    words: [창고, 품목, 자재, 거래처]  # 거래처: R5 제안 (팩 사전 단어, 거래 문서와 구분)
  - name: 수불
    words: [수불, 입고, 출고, 투입, 거래]  # 거래: R5 제안 (팩 용어 거래번호·거래유형코드의 재고 거래)
  - name: 재고 이력
    words: [이력, 실사, 조정, 로트]
