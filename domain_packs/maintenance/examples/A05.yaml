# few-shot 예시 (maintenance · A05 relationship_review). 사람이 작성하는 입력 파일이다.
# - 입력은 개발용 세트(비공개, 저장소에 올리지 않음)에서만 가져오고 source_id에 원문 ID를 적는다. 평가용 세트 문서는 넣지 않는다.
# - output은 해당 노드의 LLM 출력 모델과 같은 모양이어야 한다. load_examples가 그 모델로 검증한다 (docs/04 "노드 작성 규칙").
agent: A05
role: relationship_review
status: draft
examples:
# 지적 없음 예시: 요구사항과 맞는 자기참조 관계는 지적하지 않는다.
- source_id: MNT-002
  input:
    requirements:
    - id: REQ-01
      text: 한 설비는 상위 설비를 최대 하나 가질 수 있고 하위 설비는 여러 개 가질 수 있다.
      type: FR
    entities:
    - {id: ENT-01, name: 설비}
    relationships:
    - {id: REL-01, parent: ENT-01, child: ENT-01, cardinality: '1:N', optional: true, identifying: false, req_ids: [REQ-01]}
  output:
    findings: []
