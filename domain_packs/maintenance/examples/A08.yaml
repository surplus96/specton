# few-shot 예시 (maintenance · A08 normalization_review). 사람이 작성하는 입력 파일이다.
# - 입력은 개발용 세트(비공개, 저장소에 올리지 않음)에서만 가져오고 source_id에 원문 ID를 적는다. 평가용 세트 문서는 넣지 않는다.
# - output은 해당 노드의 LLM 출력 모델과 같은 모양이어야 한다. load_examples가 그 모델로 검증한다 (docs/04 "노드 작성 규칙").
# - 요구사항 문장은 검토 전 합성 시나리오(MNT-004)에서 지적에 필요한 부분만 줄인 것이다. 검토 대상 엔티티·관계는 예시를 위해 만든 가상 설계이고 기대 결과 자료를 쓰지 않았다.
# - A08 입력은 requirements·entities·relationships·normalized다 (#12). 부모 키는 A03 속성에 넣지 않고
#   A04 관계로 나타내며, normalized는 그 설계를 모델 정리 코드로 정리한 결과의 요약이다
#   (tests/unit/test_review_a08.py가 같은 결과인지 다시 계산해 확인한다). ID는 정리 코드가 계산한 값이다.
# - 임시(#12): 스냅샷 지적 없음 예시(MNT-015)는 원문에 시점·보존 표현이 있는지 확인하기 전이라 실행용
#   예시에서 뺐다. 주석은 LLM에 전달되지 않아, 남겨 두면 확정되지 않은 "지적 없음"이 답으로 쓰인다.
#   설계 구조(관계·정리 결과)는 tests/fixtures/a08_mnt015_pending.yaml에 두고, 원문 확인 뒤 되살리거나 교체한다.
agent: A08
role: normalization_review
status: draft
examples:
- source_id: MNT-004
  input:
    requirements:
    - id: REQ-01
      type: FR
      nfr_category: null
      text: 한 기술자는 여러 팀에 소속될 수 있다. 탈퇴한 소속도 가입·탈퇴 일자를 남긴다.
    entities:
    - id: ENT-01
      pack: maintenance
      name: 기술자
      description: 보전 작업을 수행하는 기술자
      req_ids: [REQ-01]
      crud_exemptions: []
      attributes:
      - {id: ATTR-01, name: 기술자코드, data_type: varchar, length: 10, is_key: true, nullable: false, req_ids: [REQ-01]}
      - {id: ATTR-02, name: 기술자명, data_type: varchar, length: 100, req_ids: [REQ-01]}
      - {id: ATTR-03, name: 소속팀코드목록, description: 소속 팀 코드를 쉼표로 구분해 저장, data_type: varchar, length: 200, req_ids: [REQ-01]}
    relationships: []
    normalized:
      tables:
      - id: TBL-9951839778faac62
        name: 기술자
        entity_id: ENT-01
        columns:
        - {id: COL-056b562b982f29c6, name: 기술자코드, attribute_id: ATTR-01}
        - {id: COL-98570756498e6c40, name: 기술자명, attribute_id: ATTR-02}
        - {id: COL-07e7742cee3c3180, name: 소속팀코드목록, attribute_id: ATTR-03}
        primary_key: [COL-056b562b982f29c6]
        unique_keys: []
      foreign_keys: []
  output:
    findings:
    - kind: multi_valued_attribute
      severity: major
      targets:
      - {kind: attribute, id: ATTR-03}
      evidence:
      - req_id: REQ-01
        quote: 한 기술자는 여러 팀에 소속될 수 있다.
      - req_id: REQ-01
        quote: 탈퇴한 소속도 가입·탈퇴 일자를 남긴다.
      suggestion: 한 칸에 팀 코드를 모아 담으면 소속마다 가입·탈퇴 일자를 남길 수 없고 팀 하나를 고칠 때 문자열 전체를 고쳐야 한다. 소속마다 한 행을 두는 별도 엔티티로 나눈다.
      target_stage: data_model
