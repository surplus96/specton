      - {id: ATTR-08, name: 적용시급, description: 실적을 기록할 때 적용한 시급. 이후 기준 시급이 바뀌어도 그대로 둔다, data_type: numeric, precision: 12, nullable: false, req_ids: [REQ-01]}
    relationships:
