# few-shot 예시 (maintenance · A01 requirement_analysis). 사람이 작성하는 입력 파일이다.
# - 입력은 개발용 세트(비공개, 저장소에 올리지 않음)에서만 가져오고 source_id에 원문 ID를 적는다. 평가용 세트 문서는 넣지 않는다.
# - output은 해당 노드의 LLM 출력 모델과 같은 모양이어야 한다. load_examples가 그 모델로 검증한다 (docs/04 "노드 작성 규칙").
agent: A01
role: requirement_analysis
status: draft
examples:
- source_id: MNT-009
  input: 보전 담당자는 설비, 접수 일시, 신고자 사내 식별값, 증상, 우선순위로 고장 건을 등록한다. 한 접수는 한 설비에 대한 것이며 하나 이상의 보전 작업으로 나누어 처리할 수 있다.
  output:
    type: FR
    split: true
    parts:
    - 고장 접수 등록
    - 접수를 여러 작업으로 처리
    questions:
    - 우선순위 값의 종류는 무엇입니까?
