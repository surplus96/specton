# A05 관계 모순 검토 (R1, #9). 형식 설명: docs/04-agents.md "관점 설정 형식"
reviewer_id: A05
name: 관계 모순 검토
prompt_version: a05-v1
instructions: |
  관계의 방향·개수(카디널리티)·필수 여부·식별 관계가 원문 요구사항과 모순되는지 검토한다.
  관계 문제는 엔티티 설계부터 다시 만들므로 target_stage는 data_model로 둔다.
  요구사항이 관계를 정하지 않으면 모순이 아니다. 지적하지 말고 넘어간다.
checklist:
  - 카디널리티(1:1·1:N·N:M)가 요구사항의 수량 표현("최대 하나", "여러 개", "하나 이상")과 맞는가
  - '부모·자식 방향이 요구사항의 소속·포함 관계와 맞는가 (예: 문서가 내역을 가진다면 문서가 부모)'
  - optional(필수 여부)이 요구사항의 필수 조건("반드시", "하나 이상")과 맞는가
  - 자기참조 관계(상위 설비 등)의 카디널리티와 필수 여부가 요구사항과 맞는가
  - N:M 관계가 요구사항상 실제로 양쪽 모두 여러 개인가 (한쪽이 하나면 1:N)
  - identifying(식별 관계) 여부가 자식이 부모 없이 존재할 수 없다는 요구와 맞는가
inputs: [requirements, entities, relationships]
false_positive_guards:
  - '같은 요구를 충족하는 다른 관계 표현은 지적하지 않는다 (예: N:M 대신 연결 엔티티 + 1:N 두 개)'
  - 요구사항에 근거 문장이 없는 관계 의견은 지적하지 않는다
  - 정규화·누락 속성처럼 다른 관점(A06·A08)의 문제는 지적하지 않는다
