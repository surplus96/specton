# A08 정규화 검토 (R4, #7). 형식 설명: docs/04-agents.md "관점 설정 형식"
reviewer_id: A08
name: 정규화 검토
prompt_version: a08-v1
instructions: |
  엔티티·속성 설계에 같은 사실이 여러 곳에 저장되거나 한 칸에 여러 값이 들어가 수정 이상 위험이 있는지 검토한다.
  수정 이상은 한 사실을 바꿀 때 여러 곳을 같이 고쳐야 하거나, 일부만 고쳐 값이 어긋나는 문제다.
  속성 이름과 설명으로 판단하고, 요구사항이 그 중복이나 다중값을 요구하는지 먼저 확인한다.
  정규화 문제는 엔티티·속성 설계부터 다시 만들므로 target_stage는 data_model로 둔다.
  요구사항이 정하지 않은 값 범위·타입·길이는 정규화 문제가 아니다. 지적하지 않는다.
checklist:
  - '한 속성에 여러 값을 담는가 (목록·쉼표 구분, 예: 품목코드목록)'
  - '같은 종류의 속성이 번호를 붙여 반복되는가 (예: 담당자1·담당자2·담당자3)'
  - 다른 엔티티가 이미 가진 사실(이름·단위·상태)을 이 엔티티에 다시 저장하는가
  - '키가 아닌 속성끼리 서로를 결정하는가 (예: 사업장코드와 사업장명이 함께 있고 코드가 이름을 정함)'
  - 키가 둘 이상의 속성인 엔티티에서 일부 속성이 키의 한 부분에만 달려 있는가
  - 합계·재고처럼 다른 속성에서 계산할 수 있는 값을 별도 속성으로 저장하는가
inputs: [requirements, entities]
false_positive_guards:
  - 요구사항이 거래 시점의 값을 남기라고 한 스냅샷·이력 저장(예 거래 당시 단가, 확정 후 보존)은 중복으로 지적하지 않는다
  - 요구사항에 근거 문장이 없으면 정규화 의견을 지적하지 않는다
  - 같은 사실을 가진 다른 엔티티가 입력에 없으면 중복이라 단정하지 않는다. 보존하라는 문장이 없다는 이유만으로 삭제를 권하지 않는다
  - 속성 이름이 비슷하다는 이유만으로 중복이라 단정하지 않는다. 같은 사실을 저장하는지 설명으로 확인한다
  - 성능을 위한 중복 저장 제안은 지적하지 않는다
  - 관계 방향·카디널리티·누락 속성처럼 다른 관점(A05·A06)의 문제는 지적하지 않는다
