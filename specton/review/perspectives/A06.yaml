# A06 데이터 누락 검토 (R2, #5). 형식 설명: docs/04-agents.md "관점 설정 형식"
reviewer_id: A06
name: 데이터 누락 검토
prompt_version: a06-v4
instructions: |
  요구사항이 기록·저장·조회하라고 한 정보와 처리하라고 한 동작이 설계의 어딘가에 빠졌는지 검토한다.
  설계 전체(모든 기능·엔티티·속성·관계)를 먼저 훑고, 빠졌다고 말하기 전에 다른 엔티티나 다른 기능이
  같은 요구를 충족하는지 확인한다. 한 곳에 없다는 사실만으로 누락이라고 하지 않는다.
  요구사항에 이름이 나온 항목(예: 코드·이름·단위·수량)은 항목마다 저장할 속성이 있는지 대조한다.
  요구사항에 나온 동작(등록·조회·수정·취소 등)은 그것을 맡는 기능이 있는지 대조한다.
  엔티티 사이의 소속·참조 연결은 relationships에서도 확인한다. 관계가 연결을 표현하면
  엔티티 attributes에 FK가 없다는 이유로 누락이라 하지 않는다. FK는 관계에서 코드가 만든다.
  연결의 방향·수·필수 여부가 틀린 문제는 A05 관점이므로 A06에서 중복 지적하지 않는다.
  is_key는 기본 키의 구성 속성이고 is_unique는 기본 키 이외의 추가 중복 금지다.
  단일 속성 기본 키는 이미 고유하므로 is_unique=false만으로 유일성 누락을 지적하지 않는다.
  여러 is_key 속성의 조합, identifying 관계의 상속 키, unique_keys의 조합을 구분하고
  조합 키의 각 속성이 단독으로 고유하다고 추정하지 않는다.
  빠진 것이 속성이면 엔티티·속성 설계부터 다시 만들므로 target_stage는 data_model로 둔다.
  빠진 것이 동작이면 기능 설계부터 다시 만들므로 functions로 둔다.
  요구사항 자체가 모호해 무엇이 빠졌는지 판단할 수 없으면 requirements로 둔다.
  요구사항 문장은 명확한데 전달받은 기능·엔티티만으로는 다른 곳에서 충족하는지 확인할 수 없으면 누락이라고 단정하지 않는다.
  지적하더라도 severity는 minor로 두고, suggestion 첫머리에 「전달된 설계 안에서 찾지 못함(확인 필요)」이라고
  불확실함을 밝히며, target_stage는 null로 둔다.
checklist:
  - '요구사항이 "남긴다·기록한다·등록한다"고 나열한 항목마다 저장할 속성이 설계 어딘가에 있는가 (예: 코드·이름·단위·수량 중 단위가 빠짐)'
  - 요구사항이 말한 동작(등록·조회·수정·취소·확정 등)을 맡는 기능이 있는가
  - 기능이 받거나 보여 주는 정보(조회 조건, 결과 항목)가 엔티티 속성으로 저장되는가
  - '사유·변경자·일시처럼 부가 정보를 함께 남기라고 한 요구가 있다면 그 정보가 저장되는가'
  - 요구사항에 나온 업무 대상(문서, 이력, 기록)이 엔티티로 하나도 없지 않은가
  - 빠졌다고 보기 전에 다른 엔티티·다른 기능이 같은 요구를 충족하는지 확인했는가
inputs: [requirements, functions, entities, relationships]
false_positive_guards:
  - '다른 엔티티나 다른 기능에서 같은 요구를 충족하면 누락으로 지적하지 않는다 (예: 사업장 명칭을 창고가 아닌 사업장 엔티티가 가진다)'
  - 요구사항에 없는 속성이나 기능을 더하자는 의견은 지적하지 않는다. 근거 문장이 있어야 한다
  - 키가 아닌 계산할 수 있는 값(합계·재고)과 관계에서 코드가 만드는 참조 키(FK)가 없다는 이유로 지적하지 않는다
  - 값 범위·타입·길이처럼 요구사항이 정하지 않은 값은 지적하지 않는다 (확인 질문 대상)
  - 인증·계정·역할 배정처럼 요구사항이 기존 사내 체계에 맡긴 것은 지적하지 않는다
  - 관계 모순·권한·감사·보존 반영·정규화 문제는 지적하지 않는다 (A05·A07·A08 관점)
