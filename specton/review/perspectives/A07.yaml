# A07 비기능 요구 검토 (R3, #6). 형식 설명: docs/04-agents.md "관점 설정 형식"
reviewer_id: A07
name: 비기능 요구 검토
prompt_version: a07-v1
instructions: |
  권한·감사(변경 이력)·보존·원자성 같은 비기능 요구가 설계의 어디에, 누구의 책임으로 반영됐는지 검토한다.
  반영 위치는 세 가지다. 기능(누가 무엇을 할 수 있고 무엇을 막는지), 데이터 모델(이력·상태·근거를 저장할 엔티티·속성),
  DB 밖 처리(사내 인증 체계·트랜잭션·애플리케이션 검사)다.
  속성이 있다는 사실만으로 요구가 충족됐다고 판단하지 않는다. 그 속성을 쓰는 기능과 책임이 설명에 드러나야 한다.
  DB 밖에서 처리할 요구는 저장 속성을 요구하지 말고, 그 처리를 맡는 기능 설명에 책임이 적혀 있는지만 본다.
  target_stage는 기능에 책임이 없으면 functions, 저장할 엔티티·속성이 없으면 data_model,
  요구 자체가 모호해 반영 여부를 판단할 수 없으면 requirements로 둔다.
checklist:
  - 권한 요구(역할별 허용·금지 작업)를 어느 기능이 어떤 역할 구분으로 처리하는지 설명에 드러나는가
  - 감사·변경 이력 요구(변경자·일시·변경 전후 값·사유)를 저장할 엔티티·속성이 있는가
  - 이력·확정 기록의 수정·삭제 금지 요구가 기능 설명이나 엔티티의 CRUD 면제 근거로 반영됐는가
  - 보존 요구(삭제 대신 사용 중지, 사용 중지 후 과거 이력 조회)가 상태 속성과 그것을 쓰는 기능으로 반영됐는가
  - 원자성·중복 방지 요구가 그 처리를 책임지는 기능의 설명에 적혀 있는가
false_positive_guards:
  - 인증·계정·역할 배정처럼 요구사항이 기존 사내 체계에 맡긴 것은 지적하지 않는다
  - 트랜잭션·동시성·중복 요청 처리처럼 DB 밖에서 처리할 요구는 저장 속성이 없다는 이유만으로 지적하지 않는다
  - 보존 연한·암호화 수준처럼 요구사항에 정해지지 않은 값은 지적하지 않는다 (확인 질문 대상)
  - 같은 요구를 다른 기능이나 다른 엔티티에서 충족하면 지적하지 않는다
  - 관계 모순·업무 데이터 누락·정규화 문제는 지적하지 않는다 (A05·A06·A08 관점)
inputs: [requirements, functions, entities]
