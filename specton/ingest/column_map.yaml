# 엑셀·CSV 머리글 → 기준 열 매핑 (ADR-0003). 키는 영문, 값은 고객 양식에서 볼 수 있는 머리글 이름.
# 비교할 때는 공백·줄바꿈을 지우고 비교한다. 새 양식은 이름만 덧붙이면 된다.
# 머리글이 이름으로 끝나도 맞춘다(예: 「요구사항 상세 설명」). 앞에 「=」를 붙인 이름은 똑같을 때만 맞춘다
# (「=ID」는 「변경ID」·「화면ID」를, 「=내용」은 「변경 내용」을 잡지 않는다).
# 「소분류(기능설명)」·「요구사항(목표)」처럼 괄호 안 이름과 괄호 앞 이름도 맞춘다.
# 「요구사항」 칸은 본문으로 읽되, 다른 본문 칸(예: 「요구사항 설명」)이 같이 있으면 명칭으로 읽는다.
#
# 키 → 계약 칸 (SourceRequirement) — 이름이 비슷해 헷갈리는 것이 있어 따로 적는다.
# | 키               | 고객 양식의 뜻                                   | 들어가는 계약 칸                         | 필수 |
# | source_id        | 요구사항 고유번호 (예: SFR-001). 우리 「요구사항 ID」(REQ-xx)와 다름 | source_id                      | 머리글 조건(ID + 명칭 또는 내용 / ID 없으면 명칭 + 내용) |
# | name             | 요구사항명 = 요구사항의 제목·명칭 (예: 입고 관리). ID가 아님 | source_text(내용이 없을 때) / source_extra | 머리글 조건 |
# | description      | 상세 내용 = 요구사항 본문 (예: 입고를 등록한다). 여러 칸이면 왼쪽부터 줄바꿈으로 이음 | source_text            | 머리글 조건 |
# | category         | 구분·분류 (예: 기능, 비기능)                     | source_extra (칸 이름 그대로)            | 아님 |
# | source           | 요구사항 출처 = 이 요구가 어디서 나왔나 (예: 착수 회의록, RFP 3장 = 제안요청서 3번째 장) | source_extra | 아님 |
# |                  |   ※ source_id(고유번호)·source_ref(파일 안 위치)와 다르다 |                                 |      |
# | related_ids      | 관련 요구사항 (예: SFR-002)                      | source_related_requirements              | 아님 |
# | acceptance_level | 응락수준 (예: 필수, 핵심)                        | source_acceptance_level                  | 아님 |
# source_ref(파일 안 위치: 엑셀 시트·행)는 머리글이 아니라 코드가 채운다.
source_id: [요구사항 ID, 요구사항ID, 요구사항 고유번호, 고유번호, =ID, 요구사항 번호]
category: [구분, 분류, 요구사항 분류, 요구사항 구분]
name: [요구사항명, 요구사항 명칭, 요구사항 명, 명칭, 기능명]
description: [상세 내용, 상세내용, 요구사항 상세 설명, 상세 설명, 세부 내용, 요구사항 정의, 정의, 요구사항 내용, 요구사항 설명, 기능 설명, 핵심 요구사항, =내용, =요구사항]
source: [출처, 요구사항 출처]
related_ids: [관련 요구사항, 관련요구사항]
acceptance_level: [응락수준, 응락 수준, 수용수준, 수용 수준]
