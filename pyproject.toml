[project]
name = "specton"
version = "0.1.0"
description = "Agent that designs functions and data models from customer requirements"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "openai>=1.54",
    "psycopg[binary,pool]>=3.2",
    "pglast>=6.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]
# PDF 추출·출력, HWPX 엔진은 ADR-0004 결정 후 추가한다.

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "httpx>=0.27",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["specton"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["specton"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not db and not llm'"
markers = [
    "db: requires the isolated PostgreSQL sandbox",
    "llm: calls the real LLM API (manual run after budget approval)",
]
