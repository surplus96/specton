# 로컬 단일 진입점. 운영 서버에는 compose.deploy.yml만 사용한다.
# docker compose -f compose.deploy.yml -f compose.local.yml --env-file .env.deploy up -d
services:
  api:
    environment:
      # 로컬 HTTP 전용. 운영 구성의 Secure 쿠키 기본값은 그대로 둔다.
      SPECTON_SESSION_COOKIE_SECURE: "false"
  web:
    environment:
      SPECTON_SITE_ADDRESS: ":80"
    ports:
      - "127.0.0.1:5194:8080"
      - "127.0.0.1:5196:8080"
    volumes:
      - ./docker/web/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ./docker/web/Caddyfile:/etc/caddy/Caddyfile.base:ro
