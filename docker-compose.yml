# 로컬 개발용 PostgreSQL 18. specton_app(플랫폼 상태)과 specton_sandbox(DDL 격리 검증)를 분리한다.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-specton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-specton}
      POSTGRES_DB: specton_app
      SANDBOX_PASSWORD: ${SANDBOX_PASSWORD:-specton_sandbox}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-specton} -d specton_app"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
