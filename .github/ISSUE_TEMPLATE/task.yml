name: Task
description: 구현 작업
labels: ["type:task"]
body:
  - type: input
    id: refs
    attributes:
      label: 관련 항목
      description: 저장소 안에서 찾을 수 있는 근거만 적는다 (요구사항·docs 문서·TC·ADR)
      placeholder: REQ-04, docs/04-agents.md, TC-A01, ADR-0008
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 할 일
      description: 무엇을 만들고 무엇은 범위 밖인지
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 확인 가능한 결과 (테스트, 화면, 산출물)
      placeholder: "- [ ] 고정 응답 테스트 3종 통과"
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: 선행 작업·막힌 이유
      description: 먼저 끝나야 하는 이슈(#번호)와 기다려야 하는 이유, 기다리는 동안 먼저 할 수 있는 것, 필요한 결정(ADR)
